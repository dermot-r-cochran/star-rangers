# Minimal sample deploy.conf - the two-line form. Copy this to a real
# "deploy.conf" in the repository root of the cPanel Git Version Control
# clone and edit the two values below:
#
#   cp sample-deploy-minimal.conf deploy.conf
#
# "deploy.conf" itself is untracked (gitignored) since each clone's settings
# are specific to that domain/account - the sample files are the only copies
# tracked in git.
#
# WHY TWO LINES IS ENOUGH. Everything that makes up a domain's IDENTITY -
# THEME, EDITION, CHARACTERS, TOPICS, THREADS, SITE_NAME, SITE_TITLE,
# COMMENTS_ENABLED, GISCUS_PROFILE - lives in the repo, in lib/editions.js,
# keyed by domain. scripts/resolve-edition.js looks it up by the DOMAIN set
# below and scripts/cpanel-deploy.sh fills in every key this file leaves
# unset. So for a REGISTERED domain, naming the account and the domain is the
# whole configuration.
#
# This file still wins wherever it sets a value - the registry only fills
# gaps. The deploy log prints one [edition] line per resolved key saying
# whether it came from deploy.conf or from the edition, and whether the domain
# was registered at all; read those on the first deploy rather than assuming.
#
# An UNREGISTERED domain is not an error - nothing gets filled in, and the
# build falls back to its own defaults (default theme, the "Fian Ilchruinne"
# branding, the full unfiltered site, the shared default giscus board). If
# that isn't what this domain should serve, either register it in
# lib/editions.js (tracked, reviewable) or set the keys here by hand from
# sample-deploy.conf.
#
# WHAT IS NOT HERE, DELIBERATELY. Keys this machine owns rather than the repo
# stay in deploy.conf and are never resolved from the registry: ADMIN_EMAIL,
# the raw GISCUS_*_ID values, CUSTOM_CSS_FILE, ALT_DOMAINS (with its
# ALT_<id>_* keys) and DEPLOY_PRIMARY. Copy the full sample-deploy.conf if
# this clone needs any of them - it documents every key inline, and TECHNICAL-README.md's
# "cPanel deployment config for local clones" section is the authoritative
# reference.

# Destination cPanel account: deploys to /home/<CPANEL_USER>/public_html/.
# Machine-specific, so it is never resolved from the registry.
# Default: the account the deploy runs as
CPANEL_USER=youraccount

# Public domain this clone serves - no scheme, no path, no trailing slash
# (e.g. "undercover-pets.com"). Two jobs: it builds the absolute URLs that
# robots.txt's Sitemap line and every <loc> in sitemap.xml need, and it is the
# key lib/editions.js is looked up by, so getting it right is what makes
# everything above resolve.
# Default: fianilchruinne.com
DOMAIN=fianilchruinne.com
